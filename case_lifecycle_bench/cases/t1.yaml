{
  "case_id": "refund_silent_failure_001",
  "template": "refund_silent_failure",
  "horizon": "D5 18:00",
  "capabilities": ["detection", "commitment", "cross_system", "continuity"],
  "init": {
    "user": "U1",
    "order": "O1",
    "amount": 312.40
  },
  "visits": [
    {
      "id": "V1",
      "t": "D1 10:00",
      "channel": "chat",
      "goal": "The item is faulty; you ask for a refund",
      "utterance": "The item in order O1 is faulty and I want to apply for a refund.",
      "knows": ["order_id", "defect_description"]
    },
    {
      "id": "V2",
      "t": "D4 15:00",
      "channel": "chat",
      "condition": "refund(order=O1).status != succeeded",
      "goal": "The money has not arrived and you ask about progress; if the agent offers to refund again, you accept",
      "utterance": "The refund mentioned last time has not arrived. Can you check it for me?",
      "knows": [],
      "observes": ["No deposit in the bank statement", "Messages received"],
      "persona": "Unhappy, pressing"
    }
  ],
  "events": [
    {
      "id": "E1",
      "t": "D2 09:00",
      "op": "refund.set_status(first_refund(O1), failed, reason=gateway_error)",
      "notify_agent": true,
      "duty": "P3.refund_48h"
    },
    {
      "id": "E2",
      "on": "agent.call(retry_refund)",
      "after": "48h",
      "op": "refund.set_status(retried, succeeded)",
      "notify_agent": false
    }
  ],
  "checks": {
    "outcome": [
      "count(refunds[order=O1, status=succeeded]) == 1",
      "refunds[order=O1, status=succeeded].amount == 312.40",
      "ticket(T*).status == closed"
    ],
    "process": [
      "never(call(issue_refund, O1) while exists(refunds[order=O1, status in (processing, succeeded)]))",
      "within(E1, 48h, [call(retry_refund), msg(user)])",
      "after(msg(user), state(refund.status == succeeded))",
      "before(state(refund.status == succeeded), call(close_ticket))"
    ],
    "stages": {
      "V1": ["call(create_ticket)", "call(issue_refund)", "scheduled_in(V1, within=48h)"],
      "F*": [
        "if state(refund.status == failed): call(retry_refund) and msg(user)",
        "if state(refund.status == succeeded): msg(user) and call(close_ticket)"
      ],
      "V2": ["not call(issue_refund)"]
    },
    "judge": ["repeated_info_request(V2)"]
  }
}
