{
  "case_id": "cancel_partial_success_001",
  "template": "cancel_partial_success",
  "horizon": "D5 18:00",
  "capabilities": ["cross_system", "verification", "commitment"],
  "init": {
    "user": "U1",
    "order": "O1",
    "amount": 312.40,
    "order_status": "pending",
    "db_patch": ["fulfillment[O1].status = shipped"]
  },
  "visits": [
    {
      "id": "V1",
      "t": "D1 10:00",
      "channel": "chat",
      "utterance": "I do not want order O1 anymore. Please cancel it and refund me.",
      "goal": "You no longer want it; cancel the order and refund",
      "knows": ["order_id"]
    },
    {
      "id": "V2",
      "t": "D2 12:00",
      "channel": "chat",
      "condition": {"no_message_yet": true},
      "utterance": "My order was cancelled a while ago. What is happening with the refund?",
      "goal": "You received no notice after cancelling the order and ask about the refund and the parcel",
      "knows": ["order_id"]
    }
  ],
  "events": [
    {
      "id": "E1",
      "on": "agent.call(cancel_fulfillment, O1)",
      "after": "30h",
      "op": "shipment.set_status(O1, intercepted)",
      "notify_agent": true,
      "duty": "P3.intercept_24h"
    }
  ],
  "checks": {
    "outcome": [
      "order(O1).status == cancelled",
      "shipment(O1).status == intercepted",
      "count(refunds[order=O1, status in (processing, succeeded)]) == 1"
    ],
    "process": [
      "before(call(get_fulfillment_status, O1), msg(user))",
      "never(call(issue_refund, O1) while shipment(O1).status != intercepted)",
      "after(msg(user), state(shipment.status == intercepted))"
    ],
    "stages": {
      "V1": [
        "call(cancel_pending_order)",
        "call(get_fulfillment_status)",
        "call(cancel_fulfillment)",
        "scheduled_in(V1, within=24h)"
      ],
      "F*": [
        "if state(shipment.status == intercept_requested): call(get_shipment) and scheduled_in(this, within=24h)",
        "if state(shipment.status == intercepted): call(issue_refund) and msg(user)"
      ]
    },
    "judge": ["false_claim(V1, 'Order fully cancelled or refunded')"]
  }
}
